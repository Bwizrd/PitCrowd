[package]
name = "opencry-visual"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
default-run = "opencry-visual"

[dependencies]
# Bevy without the parts the floor never uses (audio, gamepads, glTF, scenes, animation,
# picking on meshes and sprites): a smaller download for the browser demo, a quicker build.
bevy = { version = "0.18.1", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "wayland",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_text",
    "bevy_light",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_anti_alias",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_picking",
    "ui_picking",
    "bevy_sprite",
    "bevy_sprite_render",
    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
] }
ewebsock = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ehttp = "0.5"
# The synthetic market, run inside the page for the browser demo (no server needed).
floor_tape = { path = "../floor_tape", default-features = false }

[features]
default = []
# The original 2.5D isometric floor with sprite traders. Retired 2026-10-20 in favour of the 3D
# market view; build with `--features legacy_2d_floor` to bring it back (Space/Esc toggle views).
legacy_2d_floor = []

[profile.dev]
opt-level = 1
debug = 0
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3
debug = 0
strip = "debuginfo"

[profile.test]
opt-level = 1
debug = 0
strip = "debuginfo"

# Shipping wasm: small and fast. `trunk build --release` uses this; `trunk serve` stays on dev.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target.wasm32-unknown-unknown.dependencies]
web-sys = { version = "0.3.106", features = ["Window", "Location", "Storage"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

# Checked in CI with `cargo clippy --all-targets -- -D warnings`.
[lints.clippy]
# Bevy systems take their queries and resources as arguments; Bevy's own docs allow both.
type_complexity = "allow"
too_many_arguments = "allow"
# `!(x > 0.0)` is deliberate in the statistics: unlike `x <= 0.0` it also rejects NaN.
neg_cmp_op_on_partial_ord = "allow"
