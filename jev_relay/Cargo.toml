[package]
name = "jev_relay"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Holds the TypeSafe (Jev) API key and forwards System One calls for the OpenCry browser build"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 2
