[package]
name = "floor_tape"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The OpenCry floor's market tape: synthetic markets, CSV replay or your own feed, served on the tape protocol (ws + /bars) the floor reads"

[dependencies]
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
